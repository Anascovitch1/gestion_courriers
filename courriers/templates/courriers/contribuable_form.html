{% extends "courriers/base.html" %}
{% block titre %}Nouveau contribuable{% endblock %}
{% block contenu %}
<div class="row justify-content-center"><div class="col-lg-7">
  <h1 class="h5 mb-3">Nouveau contribuable</h1>
  <div class="card"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
        </div>
      {% endfor %}
      <button class="btn btn-primary" type="submit">Enregistrer</button>
      <a class="btn btn-outline-secondary" href="{% url 'contribuable_list' %}">Annuler</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
