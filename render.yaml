# Blueprint Render : un service web Django + une base PostgreSQL.
databases:
  - name: gescourrier-db
    databaseName: gescourrier
    plan: free

services:
  - type: web
    name: gescourrier
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn gestion_courriers.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gescourrier-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false